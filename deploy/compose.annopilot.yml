name: annopilot

services:
  annopilot-api:
    image: ghcr.io/hy-liyihan/annopilot-api:${ANNOPILOT_IMAGE_TAG:-main}
    container_name: annopilot-api
    restart: unless-stopped
    environment:
      APP_ENV: production
      DATA_ROOT: /data/projects
      DATABASE_PATH: /data/runtime/annopilot.sqlite
      SERVE_STATIC: "false"
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost:8888,http://127.0.0.1:8888}
      PYTHONUNBUFFERED: "1"
    volumes:
      - /opt/annopilot/data:/data
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 5

  annopilot-web:
    image: ghcr.io/hy-liyihan/annopilot-web:${ANNOPILOT_IMAGE_TAG:-main}
    container_name: annopilot-web
    restart: unless-stopped
    depends_on:
      annopilot-api:
        condition: service_healthy
    ports:
      - "${ANNOPILOT_WEB_PORT:-8888}:80"
