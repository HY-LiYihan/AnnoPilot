name: Deploy AnnoPilot

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: annopilot-deploy
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  REGISTRY_OWNER: hy-liyihan
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
  DEPLOY_REF: ${{ github.event.workflow_run.head_branch || github.ref_name }}

jobs:
  build-images:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            dockerfile: deploy/Dockerfile.api
            image: annopilot-api
          - service: web
            dockerfile: deploy/Dockerfile.web
            image: annopilot-web
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.REGISTRY_OWNER }}/${{ matrix.image }}:main
            ${{ env.REGISTRY }}/${{ env.REGISTRY_OWNER }}/${{ matrix.image }}:${{ env.DEPLOY_SHA }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.DEPLOY_SHA }}

  trigger-server:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    needs: build-images
    steps:
      - name: Trigger signed server deployment webhook
        env:
          ANNOPILOT_DEPLOY_URL: ${{ secrets.ANNOPILOT_DEPLOY_URL }}
          ANNOPILOT_WEBHOOK_SECRET: ${{ secrets.ANNOPILOT_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          test -n "$ANNOPILOT_DEPLOY_URL"
          test -n "$ANNOPILOT_WEBHOOK_SECRET"

          issued_at="$(date -u +%s)"
          payload="{\"repository\":\"${GITHUB_REPOSITORY}\",\"ref\":\"${DEPLOY_REF}\",\"sha\":\"${DEPLOY_SHA}\",\"mode\":\"image\",\"issued_at\":${issued_at}}"
          signature="$(printf '%s' "$payload" | openssl dgst -sha256 -hmac "$ANNOPILOT_WEBHOOK_SECRET" -hex | sed 's/^.* //')"

          curl --fail --show-error --silent \
            --retry 3 \
            --retry-delay 5 \
            --max-time 900 \
            -X POST "$ANNOPILOT_DEPLOY_URL" \
            -H "Content-Type: application/json" \
            -H "X-AnnoPilot-Signature: sha256=${signature}" \
            --data "$payload"
