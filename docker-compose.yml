name: annopilot

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: annopilot:local
    container_name: annopilot-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DATA_ROOT: /data/projects
      DATABASE_PATH: /data/runtime/annopilot.sqlite
      STATIC_DIR: /app/static
      PYTHONUNBUFFERED: "1"
      LLM_MODEL: gpt5.5
      LLM_TIMEOUT_SECONDS: "20"
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/data
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
